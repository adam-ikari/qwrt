<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <g transform="translate(100,0)">

  <!-- Title centered on content center (content spans x=40..700 → center 370) -->
  <text x="370" y="42" font-size="20" font-weight="bold" fill="#222" text-anchor="middle">Qzjs Architecture</text>
  <text x="370" y="64" font-size="12" fill="#666" text-anchor="middle">Host ↔ runtime over JSON messages · qzjs owns its thread and loop</text>

  <!-- ============ Host process (left) ============ -->
  <rect x="40" y="180" width="190" height="150" rx="8" fill="#e8f1fb" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="135" y="208" font-size="14" font-weight="bold" fill="#1a3a5c" text-anchor="middle">Host process</text>
  <text x="135" y="230" font-size="12" fill="#333" text-anchor="middle">C application</text>
  <text x="135" y="262" font-size="11" fill="#444" text-anchor="middle">qz_post_message</text>
  <text x="135" y="284" font-size="11" fill="#444" text-anchor="middle">message_cb</text>

  <!-- ============ qzjs runtime (middle) ============ -->
  <rect x="370" y="110" width="330" height="280" rx="8" fill="#f6f6f6" stroke="#888" stroke-width="1.5"/>
  <text x="535" y="138" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">qzjs runtime (qz_t)</text>

  <!-- internal thread / libuv / JSContext -->
  <rect x="392" y="155" width="286" height="107" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  <text x="535" y="181" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">internal thread</text>
  <text x="535" y="206" font-size="11" fill="#444" text-anchor="middle">libuv event loop</text>
  <text x="535" y="232" font-size="11" fill="#444" text-anchor="middle">JSContext</text>

  <!-- WinterTC APIs -->
  <rect x="392" y="290" width="286" height="82" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  <text x="535" y="315" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">WinterTC APIs</text>
  <text x="535" y="338" font-size="10" fill="#444" text-anchor="middle">fetch · crypto · streams · timers · fs</text>
  <text x="535" y="356" font-size="10" fill="#444" text-anchor="middle">WebSocket · serve() · Worker · …</text>

  <!-- internal thread hosts WinterTC (JSContext runs it) -->
  <path d="M535,262 L535,290" marker-end="url(#arrow)" stroke="#666" stroke-width="1.5" fill="none"/>
  <text x="547" y="280" font-size="10" fill="#666">runs</text>

  <!-- ============ Worker (below qzjs) ============ -->
  <rect x="370" y="420" width="330" height="70" rx="8" fill="#e9f7e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="535" y="447" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Worker</text>
  <text x="535" y="468" font-size="11" fill="#333" text-anchor="middle">own thread + libuv loop (real parallel)</text>

  <!-- qzjs → worker -->
  <path d="M535,390 L535,420" marker-end="url(#arrow)" stroke="#4caf50" stroke-width="1.5" fill="none"/>
  <text x="547" y="408" font-size="10" fill="#1b5e20">new Worker(url)</text>

  <!-- ============ Host ↔ runtime arrows ============ -->
  <!-- JSON in: host → qzjs -->
  <path d="M230,235 L366,235" marker-end="url(#arrow)" stroke="#666" stroke-width="1.5" fill="none"/>
  <text x="300" y="222" font-size="10" fill="#333" text-anchor="middle">qz_post_message</text>
  <text x="300" y="212" font-size="9" fill="#666" text-anchor="middle">JSON · thread-safe</text>

  <!-- JSON out: qzjs → host -->
  <path d="M366,285 L234,285" marker-end="url(#arrow)" stroke="#666" stroke-width="1.5" fill="none"/>
  <text x="300" y="304" font-size="10" fill="#333" text-anchor="middle">message_cb</text>
  <text x="300" y="318" font-size="9" fill="#666" text-anchor="middle">JSON · on qzjs thread</text>

  <!-- ============ Legend (bottom) ============ -->
  <g transform="translate(40, 520)">
    <rect x="0" y="0" width="18" height="12" fill="#e8f1fb" stroke="#4a90d9" stroke-width="1"/>
    <text x="24" y="11" font-size="10" fill="#444">Host</text>
    <rect x="90" y="0" width="18" height="12" fill="#f6f6f6" stroke="#888" stroke-width="1"/>
    <text x="114" y="11" font-size="10" fill="#444">qzjs runtime</text>
    <rect x="230" y="0" width="18" height="12" fill="#e9f7e9" stroke="#4caf50" stroke-width="1"/>
    <text x="254" y="11" font-size="10" fill="#444">Worker</text>
    <text x="340" y="11" font-size="9" fill="#888">Each runtime = own thread + libuv loop + JS state</text>
  </g>
  </g>
</svg>
